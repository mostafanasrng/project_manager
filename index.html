<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffc745">
    <title>سامانه جامع مدیریت پروژه</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              sand: {
                50: '#fdfcf9',
                100: '#f7f4ee',
                200: '#efe8db',
                300: '#e3d6c1',
                400: '#d1be9f',
                500: '#b79e78',
                600: '#9e815e',
                700: '#82684b',
                800: '#6b533c',
                900: '#564230',
              },
              gold: {
                300: '#ffd875',
                400: '#ffc745',
                500: '#f5b528',
                600: '#da9917',
              },
              taupe: {
                50: '#faf7f2',
                100: '#f4efe7',
                200: '#e5dcd0',
                300: '#ccbeaf',
                400: '#b4a392',
                500: '#a39381',
                600: '#8c7d6b',
                700: '#736556',
                800: '#5d5144',
                900: '#463c32',
              }
            },
            borderRadius: {
              '2xl': '1rem',
              '3xl': '1.5rem',
              '4xl': '2rem',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f5f2eb;
            background-image: radial-gradient(at 0% 100%, rgba(255, 199, 69, 0.18) 0px, transparent 40%),
                              radial-gradient(at 100% 0%, rgba(163, 147, 129, 0.12) 0px, transparent 40%);
            background-attachment: fixed;
            color: #1c1917;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Custom sleek warm scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #efe8db;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb {
            background: #ccbeaf;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a39381;
        }
        input, textarea, select {
            color: #1c1917 !important;
        }
        ::placeholder {
            color: #a3998b !important;
            opacity: 1;
        }
        /* Print Styles */
        @media print {
            body {
                background: white !important;
                background-image: none !important;
                color: black !important;
            }
            .no-print, header, aside, nav, .sidebar-container, button.no-print-btn {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            .print-break-inside-avoid {
                break-inside: avoid;
                page-break-inside: avoid;
            }
            .print-break-after-page {
                break-after: page;
                page-break-after: always;
            }
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body class="selection:bg-gold-400 selection:text-stone-900">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
